name: Radar DOF

on:
  workflow_dispatch:
  # Activar el cron cuando el adaptador oficial del DOF esté validado.
  # GitHub Actions usa UTC; 16:00 UTC equivale aproximadamente a la mañana en Tijuana.
  # schedule:
  #   - cron: "0 16 * * 1-5"

permissions:
  contents: write

jobs:
  radar-dof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuración
        run: |
          echo "Workflow DOF listo para pruebas manuales."
          echo "Pendiente: validar los parámetros y respuestas JSON del servicio oficial."
          test -f data/radar.json
      - name: Estado
        run: |
          echo "No se modificó el radar: no se publica un resultado vacío sin una consulta oficial comprobada."
