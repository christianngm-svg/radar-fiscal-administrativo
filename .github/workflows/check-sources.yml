name: Diagnóstico de fuentes oficiales

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 1-5"
    - cron: "30 20 * * 5"

permissions:
  contents: write

concurrency:
  group: radar-fuentes
  cancel-in-progress: false

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar disponibilidad y contrato de las fuentes
        run: python scripts/check_sources.py
      - name: Publicar estado técnico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza diagnóstico de fuentes oficiales"
            git push
          else
            echo "Sin cambios en el diagnóstico."
          fi
